
apiVersion: v1
kind: Pod
metadata:
  name: prometheus-storage-fix
  namespace: prometheus
spec:
  restartPolicy: Never
  containers:
    - name: fix-permissions
      image: busybox:1.36
      command:
        - sh
        - -c
        - "chown -R 65534:65534 /data && chmod 775 /data"
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: prometheus-server
