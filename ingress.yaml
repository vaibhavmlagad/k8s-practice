apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-app-ingress
  annotations:
    # This annotation triggers cert-manager to issue the cert
    cert-manager.io/cluster-issuer: "ca-cluster-issuer-local"
spec:
  tls:
  - hosts:
    - vaibhavlagad.dev
    secretName: tls-secret-local
  rules:
  - host: vaibhavlagad.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weather-app-svc
            port:
              number: 8080
